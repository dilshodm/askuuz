[pytest]
testpaths = tests

# The API clients import nothing from Home Assistant, so the suite exercises
# them straight from custom_components/askuuz. Putting that directory on the
# import path keeps `import api.water` from executing the integration's
# __init__.py, which would drag in the whole homeassistant package.
pythonpath = custom_components/askuuz

asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
