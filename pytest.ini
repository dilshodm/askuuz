[pytest]
testpaths = tests

# The API clients import nothing from Home Assistant, so most of the suite
# exercises them straight from custom_components/askuuz: putting that
# directory on the import path keeps `import api.water` from executing the
# integration's __init__.py. The repository root is on the path too, for the
# config-flow tests, which do need Home Assistant.
pythonpath = . custom_components/askuuz

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
